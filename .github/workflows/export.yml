name: Export Zero G APK
on: [push, workflow_dispatch]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q ZeroG-Station.zip -d src
          PROJ=$(dirname "$(find src -name project.godot | head -n1)")
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - name: Setup templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/4.3.stable/* ~/.local/share/godot/export_templates/4.3.stable/ || true

      - name: Setup Android
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          godot --headless --quit || true
          cat >> ~/.config/godot/editor_settings-4.tres <<EOF
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export APK
        run: |
          cd "$PROJECT_DIR"
          mkdir -p build/android
          godot --headless --import || true
          godot --headless --export-debug "Android" build/android/zero-g.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.PROJECT_DIR }}/build/android
