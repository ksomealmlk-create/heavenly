name: Export Zero G APK
on: [push, workflow_dispatch]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q ZeroG-Station.zip -d src
          PROJ=$(dirname "$(find src -name project.godot | head -n1)")
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - name: Setup templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/4.3.stable/* ~/.local/share/godot/export_templates/4.3.stable/ || true

      - name: Setup Android
        run: |
          rm -f /root/debug.keystore
          keytool -genkeypair -v -keystore /root/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          JAVA_PATH="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.3.tres editor_settings-4.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          echo "JAVA_PATH=$JAVA_PATH"
          ls /usr/lib/android-sdk/build-tools

      - name: Export APK
        run: |
          cd "$PROJECT_DIR"
          mkdir -p build/android
          godot --headless --import || true
          godot --headless --export-debug "Android" build/android/zero-g.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.PROJECT_DIR }}/build/android
